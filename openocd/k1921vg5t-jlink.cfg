# K1921VG5T target configuration for the NIIET OpenOCD build and J-Link.
# The J-Link interface script is provided by the OpenOCD scripts directory.

source [find interface/jlink.cfg]

adapter speed 100
reset_config trst_and_srst

set _CHIPNAME K1921VG5T
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0xDEB14001

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -endian little -chain-position $_TARGETNAME -coreid 0

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size 0x4000 -work-area-backup 0
flash bank $_CHIPNAME.flash k1921vg5t 0x0 0 0 16 $_TARGETNAME

proc sw_reset_halt {} {
    reset halt
}
