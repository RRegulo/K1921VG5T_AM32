# Keep the OpenOCD work area away from the firmware's .data/.bss and stack.
# The application uses the bottom of the 16 KiB RAM; the stack is at its end.
K1921VG5T.cpu configure -work-area-phys 0x20000800 -work-area-size 0x2000 -work-area-backup 0
riscv set_command_timeout_sec 30
riscv set_reset_timeout_sec 30
